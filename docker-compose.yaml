name: alts

services:
    jenkins:
        image: jenkins/jenkins:2.556
        restart: always
        environment:
          - TZ=Europe/Moscow
        ports:
          - "8080:8080"
        volumes:
          - ./data/jenkins:/var/jenkins_home

    postgres:
        image: postgres:18.3
        restart: always
        environment:
          - TZ=Europe/Moscow
          - POSTGRES_PASSWORD=postgres
        ports:
          - "5432:5432"
        volumes:
          - ./data/postgres:/var/lib/postgresql
          - ./init.sql:/docker-entrypoint-initdb.d/init.sql
